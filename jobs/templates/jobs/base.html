<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Govt Job Search{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f9fafb;
            color: #1f2937;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <header class="bg-white shadow">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <a href="{% url 'jobs:job_list' %}" class="text-2xl font-bold text-blue-600">GovtJobSearch</a>
            <nav>
                <a href="{% url 'jobs:job_list' %}" class="text-gray-700 hover:text-blue-600 px-3">Home</a>
                <!-- Future links for login/signup can be added here -->
            </nav>
        </div>
    </header>
    <main class="flex-grow container mx-auto px-4 py-6">
        {% block content %}{% endblock %}
    </main>
    <footer class="bg-white shadow mt-12">
        <div class="container mx-auto px-4 py-4 text-center text-gray-500 text-sm">
            &copy; 2024 GovtJobSearch. All rights reserved.
        </div>
    </footer>
</body>
</html>
